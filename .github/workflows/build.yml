# Build Windows portable + setup and publish on tag v*
#
# Triggers:
#   - push tag vX.Y.Z  → build + GitHub Release
#   - workflow_dispatch → build + upload artifacts (optional release)

name: Build Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create a GitHub Release after build"
        type: boolean
        default: false
      tag_name:
        description: "Release tag (e.g. v0.1.1). Required when create_release is true."
        type: string
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (portable + NSIS)
        run: npm run dist
        env:
          # Avoid code-signing prompts on CI
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

      - name: List dist
        shell: pwsh
        run: Get-ChildItem dist -File | Format-Table Name, Length

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenUsage-Grok-windows
          path: |
            dist/OpenUsage-Grok-*-portable.exe
            dist/OpenUsage-Grok-*-setup.exe
          if-no-files-found: error

      - name: Validate release tag
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${RELEASE_TAG:-}" ]]; then
            echo "Missing RELEASE_TAG"
            exit 1
          fi
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-].*)?$ ]]; then
            echo "Invalid RELEASE_TAG: $RELEASE_TAG (expected vMAJOR.MINOR.PATCH)"
            exit 1
          fi
          PKG_VER=$(node -p "require('./package.json').version")
          TAG_VER="${RELEASE_TAG#v}"
          if [[ "$TAG_VER" != "$PKG_VER" ]]; then
            echo "Tag $RELEASE_TAG does not match package.json version $PKG_VER"
            exit 1
          fi
          echo "Release tag OK: $RELEASE_TAG"

      - name: Create GitHub Release
        if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: OpenUsage Grok ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/OpenUsage-Grok-*-portable.exe
            dist/OpenUsage-Grok-*-setup.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
